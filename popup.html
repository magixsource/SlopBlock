<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SlopBlock</title>
    <style>
        * { box-sizing: border-box; }
        body {
            width: 340px;
            margin: 0;
            font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #fff;
            color: #18191c;
        }
        .header { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; }
        .logo { width: 32px; height: 32px; border-radius: 8px; flex: none; }
        h1 { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
        .count { font-size: 12px; color: #9499a0; margin: 0; }
        .settings {
            margin-left: auto; border: 0; background: transparent; color: #9499a0;
            font-size: 18px; line-height: 1; padding: 4px 6px; border-radius: 6px; cursor: pointer;
        }
        .settings:hover { background: #f1f2f3; color: #00aeec; }
        .list { max-height: 420px; overflow-y: auto; padding: 2px 10px 6px; scrollbar-width: none; }
        .list::-webkit-scrollbar { display: none; }
        .item { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 8px; }
        .item:hover { background: #f6f7f8; }
        .avatar {
            width: 28px; height: 28px; border-radius: 50%; flex: none;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #00aeec, #7bd3ff);
            color: #fff; font-size: 13px; font-weight: 600;
        }
        .meta { flex: 1; min-width: 0; }
        .name {
            display: block; font-size: 13px; line-height: 1.35; color: #18191c;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .name.unknown { color: #9499a0; }
        .id {
            display: block; margin-top: 2px; font-size: 11px; color: #9499a0;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .remove {
            flex: none; border: 0; background: transparent; color: #9499a0;
            border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer;
        }
        .remove:hover { background: #fff1f0; color: #f56c6c; }
        .empty { padding: 36px 16px; text-align: center; color: #9499a0; font-size: 13px; }
        .empty .sub { margin-top: 6px; font-size: 12px; color: #c0c4cc; }
        .pager {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 14px; border-top: 1px solid #f1f2f3;
        }
        .pager[hidden] { display: none; }
        .page-btn {
            border: 0; background: #f6f7f8; color: #18191c; border-radius: 6px;
            padding: 4px 10px; font-size: 12px; cursor: pointer;
        }
        .page-btn:hover:not(:disabled) { background: #eef0f2; }
        .page-btn:disabled { color: #c0c4cc; background: #fafafa; cursor: default; }
        .page-info { font-size: 12px; color: #9499a0; font-variant-numeric: tabular-nums; }
        .hint {
            margin: 0; padding: 9px 14px; font-size: 12px; line-height: 1.5;
            color: #9499a0; background: #f6f7f8; border-top: 1px solid #f1f2f3;
        }
        .hint b { color: #61666d; font-weight: 500; }
        .toast {
            position: fixed; left: 12px; right: 12px; bottom: 10px; z-index: 10;
            padding: 7px 10px; border-radius: 6px; font-size: 12px;
            box-shadow: 0 2px 10px rgba(0,0,0,.12); display: none;
        }
        .toast.show { display: block; }
        @media (prefers-color-scheme: dark) {
            body { background: #18191c; color: #e3e5e7; }
            .item:hover { background: #23262b; }
            .name { color: #e3e5e7; }
            .hint { background: #23262b; border-top-color: #2b2e33; color: #9499a0; }
            .hint b { color: #c0c4cc; }
        }
    </style>
</head>
<body>
    <div class="header">
        <img class="logo" src="images/icon_32.png" alt="">
        <div>
            <h1>SlopBlock</h1>
            <p class="count" id="count">共屏蔽 0 位UP主</p>
        </div>
        <button type="button" class="settings" id="openSettings" title="设置（导入公共清单）">⚙</button>
    </div>

    <div class="list" id="list"></div>

    <div class="pager" id="pager" hidden>
        <button type="button" class="page-btn" id="prevPage">上一页</button>
        <span class="page-info" id="pageInfo">1 / 1</span>
        <button type="button" class="page-btn" id="nextPage">下一页</button>
    </div>

    <p class="hint">在 B 站视频卡片上右键 → <b>「屏蔽此UP主」</b></p>
    <div class="toast" id="toast"></div>

    <script src="popup.js"></script>
</body>
</html>
